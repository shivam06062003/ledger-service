global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ledger-api
    static_configs:
      - targets: ["api:8000"]

  # DNS service discovery: `worker` resolves to EVERY replica's IP, so
  # `docker compose up --scale worker=3` is picked up automatically.
  - job_name: ledger-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
