[project]
name = "ledger-service"
version = "0.1.0"
description = "A double-entry payments ledger service with idempotent transfers and reliable event delivery."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # <2.1: opentelemetry-instrumentation-sqlalchemy does not support 2.1 yet
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "structlog>=24.4",
    "httpx>=0.27",  # webhook delivery (worker)
    "redis>=5.0",  # rate limiting
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "ASYNC",    # blocking calls inside async code
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test session: the SQLAlchemy connection pool
# holds connections bound to a loop, so per-test loops would break them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
