name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger
      ENVIRONMENT: test
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrations round-trip (upgrade, downgrade, upgrade)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Models match migrations (no un-migrated model changes)
        run: alembic check
      - run: pytest -v

  observability-config:
    name: Validate Prometheus config & alerts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/p:ro"
          prom/prometheus:v3.5.0 check config /p/prometheus.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledger-service:ci .
